name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2

      - name: Configure, build and test (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2

      - name: Configure, build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp build/cpu_sim build/cpu_configurator package/
          cp -R configs package/
          tar -czf cpu-sandbox.tar.gz -C package .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p package
          cp build/cpu_sim.exe build/cpu_configurator.exe package/
          cp -R configs package/
          ldd build/cpu_sim.exe build/cpu_configurator.exe | awk '/\/mingw64\/bin\// {print $3}' | sort -u | xargs -r cp -t package/

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: cpu-sandbox-${{ matrix.os }}
          path: cpu-sandbox.tar.gz

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: cpu-sandbox-${{ matrix.os }}
          path: package/

      - name: Run tests (Linux and macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
